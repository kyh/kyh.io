name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      # An installed mod runs its committed dist/ as is; a change to world/ or
      # stream/ without a rebuild would ship the old game.
      - name: Mod build is committed
        run: |
          pnpm -F @repo/mod-clawders build
          git diff --exit-code -- apps/mod-clawders/dist
          test -z "$(git status --porcelain -- apps/mod-clawders/dist)"

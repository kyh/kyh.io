<!doctype html>
<!--
  og:video scene for Stonksville (pnpm og:video stonksville): candles build up
  to the now line, three bets land on the grid ahead of the price, time runs,
  the price walks into one and it wins, then the wordmark. Prices are abstract:
  no dates, no values, nothing that goes stale. Drawn for any time t
  (scripts/og-video.mjs).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stonksville og:video scene</title>
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url("../../apps/stonksville/src/app/geist-mono-bold.ttf");
      }
      html,
      body {
        margin: 0;
        background: #0e0a10;
      }
      canvas {
        display: block;
        width: 1200px;
        height: 630px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="2400" height="1260"></canvas>
    <script>
      // The game's own look: the chart's emerald, the bet cells' yellow, its dark violet-black.
      const BG = "#0e0a10";
      const UP = "#34d399";
      const DOWN = "#f87171";
      const BET = "#facc15";
      const DURATION = 8500;

      const clamp = (x) => Math.max(0, Math.min(1, x));
      const seg = (t, start, length) => clamp((t - start) / length);
      const easeOut = (x) => 1 - (1 - x) ** 3;
      const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
      const spring = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-5.5 * x) * Math.cos(8.5 * x));
      let seed = 3;
      const random = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };

      // An abstract walk: candle i opens at close i-1.
      const COUNT = 48;
      const closes = [];
      let price = 0;
      for (let i = 0; i < COUNT; i += 1) {
        price += (random() - 0.47) * 2.2;
        closes.push(price);
      }
      // The walk climbs into the first bet's cell once time runs.
      const WIN_AT = 33;
      for (let i = 30; i < COUNT; i += 1) {
        closes[i] = closes[29] + (i - 29) * 1.1 + Math.sin(i * 1.7) * 0.7;
      }
      const candles = closes.map((close, i) => {
        const open = i === 0 ? close - 0.4 : closes[i - 1];
        const wick = 0.25 + random() * 0.6;
        return {
          close,
          high: Math.max(open, close) + wick,
          low: Math.min(open, close) - wick,
          open,
        };
      });

      const STEP = 32;
      const NOW_X = 760;
      const CELL = { h: 64, w: STEP * 2 };
      // Scaled to what is on screen by the end: the first 38 candles.
      const shown = candles.slice(0, 38);
      const LOW = Math.min(...shown.map((candle) => candle.low));
      const HIGH = Math.max(...shown.map((candle) => candle.high));
      const yOf = (value) => 540 - ((value - LOW) / (HIGH - LOW)) * 440;

      const bets = [
        { at: WIN_AT, label: "2.0x", land: 2600, value: closes[WIN_AT] },
        { at: 36, label: "3.5x", land: 3000, value: closes[36] + 1.2 },
        { at: 38, label: "1.5x", land: 3400, value: closes[38] - 4 },
      ];

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      /** The scene at time t, without the wordmark: the loop ends back on its first frame. */
      const chart = (t) => {
        // Candles build in left to right, then time runs four candles on.
        const reveal = 29 * easeInOut(seg(t, 200, 2200));
        const run = 4.6 * easeInOut(seg(t, 3900, 1700));
        const now = reveal + run;
        const xOf = (index) => NOW_X - (now - index) * STEP;

        // The grid scrolls with time.
        ctx.strokeStyle = "rgba(52, 211, 153, 0.09)";
        ctx.lineWidth = 1;
        const shift = (run * STEP) % CELL.w;
        for (let x = -shift; x < 1200; x += CELL.w) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 630);
          ctx.stroke();
        }
        for (let y = 22; y < 630; y += CELL.h) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(1200, y);
          ctx.stroke();
        }

        for (let i = 0; i < COUNT; i += 1) {
          const grow = clamp(now - i);
          if (grow <= 0) break;
          const candle = candles[i];
          const x = xOf(i) - STEP / 2;
          if (x < -STEP) continue;
          const color = candle.close >= candle.open ? UP : DOWN;
          const k = easeOut(grow);
          const mid = (yOf(candle.open) + yOf(candle.close)) / 2;
          const top = mid + (Math.min(yOf(candle.open), yOf(candle.close)) - mid) * k;
          const bottom = mid + (Math.max(yOf(candle.open), yOf(candle.close)) - mid) * k;
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x, mid + (yOf(candle.high) - mid) * k);
          ctx.lineTo(x, mid + (yOf(candle.low) - mid) * k);
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.fillRect(x - 10, top, 20, Math.max(3, bottom - top));
        }

        // The now line and the live price.
        const nowAlpha = seg(t, 300, 500);
        ctx.globalAlpha *= nowAlpha;
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "rgba(250, 250, 250, 0.3)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(NOW_X, 0);
        ctx.lineTo(NOW_X, 630);
        ctx.stroke();
        ctx.setLineDash([]);
        const last = Math.max(0, Math.min(COUNT - 1, Math.floor(now)));
        const liveY = yOf(candles[last].close);
        ctx.fillStyle = UP;
        ctx.beginPath();
        ctx.arc(NOW_X, liveY, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha /= nowAlpha;

        for (const bet of bets) {
          const drop = spring(seg(t, bet.land, 650));
          if (drop <= 0) continue;
          const x = xOf(bet.at) - CELL.w / 2;
          const y = yOf(bet.value) - CELL.h / 2;
          const won = bet.at === WIN_AT ? easeOut(seg(now, WIN_AT - 0.15, 0.3)) : 0;
          const scale = 0.4 + 0.6 * drop + 0.12 * Math.sin(Math.PI * won);
          ctx.save();
          ctx.translate(x + CELL.w / 2, y + CELL.h / 2);
          ctx.scale(scale, scale);
          ctx.globalAlpha *= clamp(drop * 2);
          ctx.fillStyle = won > 0.5 ? UP : BET;
          ctx.fillRect(-CELL.w / 2 - 6, -CELL.h / 2, CELL.w + 12, CELL.h);
          ctx.fillStyle = BG;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "700 24px 'Geist Mono'";
          ctx.fillText(won > 0.5 ? "WIN" : "$10", 0, -11);
          ctx.font = "700 19px 'Geist Mono'";
          ctx.fillText(won > 0.5 ? "+$20" : bet.label, 0, 15);
          ctx.restore();
          if (bet.at === WIN_AT) confetti(x + CELL.w / 2, y + CELL.h / 2, t);
        }
      };

      const confetti = (x, y, t) => {
        // Bursts once the price reaches the cell (at about 5.1s).
        const age = seg(t, 5050, 1100);
        if (age <= 0 || age >= 1) return;
        let s = 99;
        const r = () => {
          s = (s * 16807) % 2147483647;
          return s / 2147483647;
        };
        for (let i = 0; i < 28; i += 1) {
          const angle = r() * Math.PI * 2;
          const speed = 120 + r() * 160;
          const d = easeOut(age) * speed;
          const px = x + Math.cos(angle) * d;
          const py = y + Math.sin(angle) * d + age * age * 120;
          ctx.globalAlpha = 1 - age;
          ctx.fillStyle = i % 2 ? UP : BET;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(angle + age * 6);
          ctx.fillRect(-5, -3, 10, 6);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      };

      const render = (t) => {
        ctx.setTransform(2, 0, 0, 2, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, 1200, 630);
        // The chart fades out under the wordmark, and back in as frame one.
        const away = easeInOut(seg(t, 6000, 500)) * (1 - easeInOut(seg(t, 7900, 600)));
        ctx.globalAlpha = 1 - 0.85 * away;
        chart(t > 7900 ? 0 : t);
        ctx.globalAlpha = 1;
        if (away > 0) {
          const rise = spring(seg(t, 6150, 900));
          ctx.globalAlpha = away * clamp(rise * 1.5);
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          ctx.fillStyle = UP;
          ctx.font = "700 112px 'Geist Mono'";
          ctx.fillText("Stonksville", 600, 330 + (1 - rise) * 30);
          ctx.fillStyle = "rgba(250, 250, 250, 0.75)";
          ctx.font = "700 32px 'Geist Mono'";
          ctx.fillText("Tap the grid. Bet where the price goes next.", 600, 395 + (1 - rise) * 30);
          ctx.globalAlpha = 1;
        }
      };

      window.scene = { duration: DURATION, render };
      window.sceneReady = document.fonts.load("700 40px 'Geist Mono'").then(() => render(0));
    </script>
  </body>
</html>
